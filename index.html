<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ImportArg | Lista Mayorista</title>

<style>
:root{
  --black:#111111;
  --yellow:#ffd400;
  --green:#a7edba;
  --green-dark:#075b24;
  --whatsapp:#25D366;
  --bg:#f4f4f4;
  --line:#e5e5e5;
  --blue:#1687df;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#111;
}

/* ========================================
   HEADER
======================================== */

header{
  background:linear-gradient(135deg,#090909,#202020);
  border-bottom:4px solid var(--yellow);
  padding-top:calc(env(safe-area-inset-top) + 5px);
}

.header{
  max-width:1450px;
  margin:auto;
  padding:8px 14px 10px;
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:10px 15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.brand-logo{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:2px solid var(--yellow);
}

.logo{
  color:white;
  font-size:24px;
  font-weight:750;
  letter-spacing:-1px;
  line-height:1;
  white-space:nowrap;
}

.logo span{
  color:var(--yellow);
  font-weight:800;
}

.title{
  text-align:right;
  color:white;
}

.title strong{
  font-size:23px;
  font-weight:950;
}

.title span{
  color:var(--yellow);
}

/* ========================================
   MAIN
======================================== */

main{
  max-width:1450px;
  margin:auto;
  padding:12px 12px 80px;
}

/* ========================================
   BUSCADOR
======================================== */

.search-wrapper{
  width:100%;
  display:flex;
  height:48px;
  margin-bottom:11px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.07));
}

#search{
  flex:1;
  min-width:0;
  border:1px solid #d6d6d6;
  border-right:0;
  border-radius:24px 0 0 24px;
  background:white;
  padding:0 17px;
  font-size:16px;
  color:#111;
  outline:none;
}

#search::placeholder{
  color:#8b8b8b;
}

#search:focus{
  border-color:#aaa;
}

.search-button{
  width:62px;
  flex:0 0 62px;
  border:1px solid #d6d6d6;
  border-radius:0 24px 24px 0;
  background:#f8f8f8;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
}

.search-button:hover{
  background:#eeeeee;
}

.search-button:active{
  background:#e3e3e3;
}

.search-button svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:#222;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ========================================
   FILTROS
======================================== */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 0 9px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:0;
  background:white;
  color:var(--blue);
  border-radius:22px;
  padding:9px 17px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.filter.active{
  background:var(--yellow);
  color:#111;
}

/* ========================================
   RESULTADOS
======================================== */

.results{
  font-size:11px;
  color:#777;
  font-weight:600;
  margin:1px 3px 9px;
}

/* ========================================
   LOADING
======================================== */

.loading{
  background:white;
  padding:35px 15px;
  text-align:center;
  border-radius:12px;
}

.spinner{
  width:30px;
  height:30px;
  margin:0 auto 10px;
  border:4px solid #ddd;
  border-top-color:var(--yellow);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ========================================
   PC TABLE
======================================== */

.table-wrap{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#111;
  color:white;
}

th{
  padding:11px 8px;
  font-size:12px;
}

th.price-head{
  background:var(--yellow);
  color:#111;
}

td{
  padding:8px;
  text-align:center;
  font-size:12px;
  border-bottom:1px solid #ddd;
}

tbody tr:nth-child(even){
  background:#f5f5f5;
}

.desktop-price{
  font-weight:900;
}

/* BOTÓN COMPRAR PC */

.desktop-buy{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:82px;
  height:30px;
  padding:0 12px;
  border-radius:8px;
  background:var(--yellow);
  color:#111;
  font-size:10px;
  font-weight:950;
  text-decoration:none;
  box-shadow:0 2px 5px rgba(0,0,0,.10);
  transition:transform .08s ease, background .15s ease;
}

.desktop-buy:hover{
  background:#ffdf35;
}

.desktop-buy:active{
  transform:scale(.96);
}

/* ========================================
   STOCK
======================================== */

.stock{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:67px;
  padding:5px 9px;
  border-radius:20px;
  background:var(--green);
  color:var(--green-dark);
  font-size:10px;
  font-weight:900;
}

.no-stock{
  background:#ffd0d0;
  color:#8b0000;
}

/* ========================================
   MOBILE
======================================== */

.mobile-list{
  display:none;
}

.product-row{
  background:white;
  border:1px solid #e7e7e7;
  border-radius:11px;
  min-height:68px;
  margin-bottom:7px;
  padding:8px 9px 8px 10px;

  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-rows:auto auto;

  column-gap:10px;
  row-gap:5px;

  align-items:center;

  box-shadow:0 2px 7px rgba(0,0,0,.055);
}

.product-top,
.product-bottom{
  min-width:0;
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

.product-top{
  grid-column:1;
  grid-row:1;
}

.product-bottom{
  grid-column:1;
  grid-row:2;
}

.product-main{
  color:#111;
  font-size:12px;
  line-height:1.15;
  font-weight:900;
}

.product-meta{
  color:#3b3b3b;
  font-size:12px;
  line-height:1.15;
  font-weight:850;
}

.product-sep{
  color:#aaa;
  font-weight:800;
}

.mobile-price{
  grid-column:2;
  grid-row:1;
  padding:0;
  border:0;
  font-size:14px;
  font-weight:950;
  white-space:nowrap;
  text-align:right;
}

/* COMPRAR CELULAR */

.buy-button{
  grid-column:2;
  grid-row:2;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:76px;
  height:29px;

  padding:0 10px;

  border-radius:8px;

  background:var(--yellow);
  color:#111;

  font-size:10px;
  font-weight:950;

  text-decoration:none;

  box-shadow:0 2px 5px rgba(0,0,0,.12);

  transition:
    transform .08s ease,
    background .15s ease;
}

.buy-button:hover{
  background:#ffdf35;
}

.buy-button:active{
  transform:scale(.96);
}

/* ========================================
   WHATSAPP FLOTANTE
======================================== */

.whatsapp-floating{
  position:fixed;

  right:15px;
  bottom:calc(15px + env(safe-area-inset-bottom));

  width:55px;
  height:55px;

  border-radius:50%;

  background:var(--whatsapp);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:100;

  box-shadow:0 5px 20px rgba(0,0,0,.24);

  text-decoration:none;
}

.whatsapp-floating svg{
  width:33px;
  height:33px;
  fill:white;
}

/* ========================================
   MOBILE
======================================== */

@media(max-width:700px){

  header{
    padding-top:calc(env(safe-area-inset-top) + 3px);
  }

  .header{
    padding:7px 12px 9px;
  }

  .brand{
    gap:6px;
  }

  .brand-logo{
    width:34px;
    height:34px;
    flex-basis:34px;
  }

  .logo{
    font-size:20px;
    font-weight:750;
  }

  .logo span{
    font-weight:800;
  }

  .title strong{
    font-size:17px;
  }

  main{
    padding:10px 8px 75px;
  }

  .search-wrapper{
    height:46px;
    margin-bottom:10px;
  }

  #search{
    font-size:15px;
  }

  .search-button{
    width:58px;
    flex-basis:58px;
  }

  .search-button svg{
    width:26px;
    height:26px;
  }

  .filter{
    padding:8px 14px;
    font-size:10px;
  }

  .table-wrap{
    display:none !important;
  }

  .mobile-list{
    display:block;
  }

  .stock{
    min-width:0;
    padding:4px 7px;
    font-size:9px;
    line-height:1;
  }
}

/* ========================================
   TELÉFONOS ANGOSTOS
======================================== */

@media(max-width:390px){

  .product-row{
    min-height:66px;
    padding:7px 7px 7px 9px;
    column-gap:7px;
  }

  .product-main,
  .product-meta{
    font-size:11px;
  }

  .mobile-price{
    font-size:13px;
  }

  .buy-button{
    min-width:70px;
    height:28px;
    padding:0 8px;
    font-size:9px;
  }

  .stock{
    padding:4px 6px;
    font-size:8px;
  }
}

</style>
</head>

<script>

/* ========================================
   CONFIG
======================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vT8v35uv1oCfpyY7_R0fSKYG08h43uApPtUIy-VBItP2Njs99BeXR5VkKeWtZ5L2w/pub?output=csv";

const WHATSAPP = "5491124014722";

let products = [];
let currentFilter = "TODOS";

/* ========================================
   CSV
======================================== */

function parseCSV(text){

  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;

  for(let i=0;i<text.length;i++){

    const c = text[i];

    if(c === '"'){

      if(
        quoted &&
        text[i+1] === '"'
      ){

        field += '"';
        i++;

      }else{

        quoted = !quoted;

      }

    }

    else if(
      c === "," &&
      !quoted
    ){

      row.push(field);
      field = "";

    }

    else if(
      (c === "\n" || c === "\r") &&
      !quoted
    ){

      if(
        c === "\r" &&
        text[i+1] === "\n"
      ){
        i++;
      }

      row.push(field);

      if(
        row.some(
          x => x.trim() !== ""
        )
      ){
        rows.push(row);
      }

      row = [];
      field = "";

    }

    else{

      field += c;

    }

  }

  if(
    field.length ||
    row.length
  ){

    row.push(field);

    if(
      row.some(
        x => x.trim() !== ""
      )
    ){
      rows.push(row);
    }

  }

  return rows;

}

/* ========================================
   UTILIDADES
======================================== */

function clean(value){

  return String(value ?? "")
    .replace(/\uFEFF/g,"")
    .trim();

}

function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function inStock(status){

  const value =
    String(status || "")
      .toUpperCase();

  return(
    value.includes("STOCK") &&
    !value.includes("SIN")
  );

}

/* ========================================
   PRECIO
======================================== */

function formatPrice(price){

  return clean(price);

}

/* ========================================
   WHATSAPP / COMPRAR
======================================== */

function whatsappLink(p){

  const message =
`Hola ImportArg! Quiero consultar por:

${p.product} ${p.model}
Capacidad: ${p.capacity}
Color: ${p.color}
${p.detail ? "Detalle: " + p.detail : ""}
Precio: ${p.price}`;

  return (
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message)
  );

}

/* ========================================
   CARGAR GOOGLE SHEETS
======================================== */

async function loadProducts(){

  try{

    const response =
      await fetch(
        CSV_URL +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "No se pudo cargar Google Sheets"
      );

    }

    const text =
      await response.text();

    const rows =
      parseCSV(text);

    const headerIndex =
      rows.findIndex(
        row =>

          clean(row[0])
            .toUpperCase()
            === "PRODUCTO"

          &&

          clean(row[1])
            .toUpperCase()
            === "MODELO"
      );

    if(headerIndex === -1){

      throw new Error(
        "No encontré PRODUCTO / MODELO"
      );

    }

    const headers =
      rows[headerIndex]
        .map(
          value =>
            clean(value)
              .toUpperCase()
        );

    const col =
      name =>
        headers.indexOf(name);

    const cProduct =
      col("PRODUCTO");

    const cModel =
      col("MODELO");

    const cCapacity =
      col("CAPACIDAD");

    const cColor =
      col("COLOR");

    const cDetail =
      col("DETALLE");

    const cPrice =
      col("PRECIO");

    const cStatus =
      col("ESTADO");

    products =
      rows
        .slice(
          headerIndex + 1
        )
        .map(
          row => ({

            product:
              clean(row[cProduct]),

            model:
              clean(row[cModel]),

            capacity:
              clean(row[cCapacity]),

            color:
              clean(row[cColor]),

            detail:
              clean(row[cDetail]),

            price:
              clean(row[cPrice]),

            status:
              clean(row[cStatus])

          })
        )
        .filter(
          p =>
            p.product ||
            p.model ||
            p.price
        );

    document
      .getElementById("loading")
      .style.display =
      "none";

    if(
      window.innerWidth > 700
    ){

      document
        .getElementById("tableWrap")
        .style.display =
        "block";

    }

    render();

  }

  catch(error){

    console.error(error);

    document
      .getElementById("loading")
      .innerHTML =

      `<strong>
        No se pudo cargar la lista.
      </strong>

      <br><br>

      Revisá que Google Sheets
      siga publicado como CSV.`;

  }

}

/* ========================================
   FILTRADO
======================================== */

function filteredProducts(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toUpperCase();

  return products.filter(
    p => {

      const text = [

        p.product,
        p.model,
        p.capacity,
        p.color,
        p.detail,
        p.price,
        p.status

      ]
        .join(" ")
        .toUpperCase();

      const searchOK =
        text.includes(search);

      const product =
        p.product
          .toUpperCase();

      let filterOK = true;

      if(
        currentFilter ===
        "IPHONE"
      ){

        filterOK =

          product.includes("IPHONE")

          ||

          product.includes("APPLE");

      }

      else if(
        currentFilter ===
        "SAMSUNG"
      ){

        filterOK =
          product.includes(
            "SAMSUNG"
          );

      }

      else if(
        currentFilter ===
        "XIAOMI"
      ){

        filterOK =

          product.includes("XIAOMI")

          ||

          product.includes("POCO")

          ||

          product.includes("REDMI");

      }

      return(
        searchOK &&
        filterOK
      );

    }
  );

}

/* ========================================
   RENDER
======================================== */

function render(){

  const list =
    filteredProducts();

  document
    .getElementById("results")
    .textContent =

    list.length +

    (
      list.length === 1
        ? " producto"
        : " productos"
    );

  renderMobile(list);

  renderDesktop(list);

}

/* ========================================
   MOBILE
======================================== */

function renderMobile(list){

  const container =
    document.getElementById(
      "mobileList"
    );

  container.innerHTML =

    list.map(
      p => {

        const stockOK =
          inStock(p.status);

        const status =
          p.status ||
          "CONSULTAR";

        const detail =
          p.detail || "";

        return `

        <div class="product-row">

          <div class="product-top">

            <span class="product-main">
              ${safe(p.product)}
              ${safe(p.model)}
            </span>

            ${
              p.capacity
                ? `
                  <span class="product-sep">·</span>

                  <span class="product-meta">
                    ${safe(p.capacity)}
                  </span>
                `
                : ""
            }

            ${
              p.color
                ? `
                  <span class="product-sep">·</span>

                  <span class="product-meta">
                    ${safe(p.color)}
                  </span>
                `
                : ""
            }

          </div>

          <div class="mobile-price">

            ${safe(
              formatPrice(
                p.price
              )
            )}

          </div>

          <div class="product-bottom">

            ${
              detail
                ? `
                  <span class="product-meta">
                    ${safe(detail)}
                  </span>

                  <span class="product-sep">·</span>
                `
                : ""
            }

            <span
              class="stock
              ${stockOK ? "" : "no-stock"}"
            >

              ${safe(status)}

            </span>

          </div>

          <a
            class="buy-button"
            href="${whatsappLink(p)}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Comprar ${safe(p.product)} ${safe(p.model)}"
          >
            COMPRAR
          </a>

        </div>

        `;

      }
    )
    .join("");

}

/* ========================================
   DESKTOP / PC
======================================== */

function renderDesktop(list){

  document
    .getElementById("table")
    .innerHTML =

    list.map(
      p => {

        const stockOK =
          inStock(p.status);

        return `

        <tr>

          <td>
            <strong>
              ${safe(p.product)}
            </strong>
          </td>

          <td>
            ${safe(p.model)}
          </td>

          <td>
            ${safe(p.capacity)}
          </td>

          <td>
            ${safe(p.color)}
          </td>

          <td>
            ${safe(p.detail)}
          </td>

          <td class="desktop-price">

            ${safe(
              formatPrice(
                p.price
              )
            )}

          </td>

          <td>

            <span
              class="stock
              ${stockOK ? "" : "no-stock"}"
            >

              ${safe(
                p.status ||
                "CONSULTAR"
              )}

            </span>

          </td>

          <td>

            <a
              class="desktop-buy"
              href="${whatsappLink(p)}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Comprar ${safe(p.product)} ${safe(p.model)}"
            >
              COMPRAR
            </a>

          </td>

        </tr>

        `;

      }
    )
    .join("");

}

/* ========================================
   BUSCADOR
======================================== */

const searchInput =
  document.getElementById(
    "search"
  );

searchInput.addEventListener(
  "input",
  render
);

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    () => {

      render();

      searchInput.focus();

    }
  );

searchInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      render();

      searchInput.blur();

    }

  }
);

/* ========================================
   FILTROS
======================================== */

document
  .querySelectorAll(".filter")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter"
            )
            .forEach(
              b =>
                b.classList
                  .remove("active")
            );

          button
            .classList
            .add("active");

          currentFilter =
            button.dataset.filter;

          render();

        }
      );

    }
  );

/* ========================================
   START
======================================== */

loadProducts();

/*
  Actualiza Google Sheets
  automáticamente cada 5 minutos.
*/

setInterval(
  loadProducts,
  300000
);

</script>

</body>
</html>
