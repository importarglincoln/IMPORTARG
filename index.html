<style>

<script>


/* =========================
   CONFIGURACIÓN
========================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vT8v35uv1oCfpyY7_R0fSKYG08h43uApPtUIy-VBItP2Njs99BeXR5VkKeWtZ5L2w/pub?output=csv";

const WHATSAPP =
"5491124014722";

const SITE_URL =
"https://importarg.com.ar/";

let products = [];

let currentFilter =
"TODOS";


/* =========================
   LEER CSV
========================= */

function parseCSV(text){

  const rows = [];

  let row = [];

  let field = "";

  let quoted = false;


  for(
    let i = 0;
    i < text.length;
    i++
  ){

    const c =
      text[i];


    if(c === '"'){

      if(
        quoted &&
        text[i + 1] === '"'
      ){

        field += '"';

        i++;

      }

      else{

        quoted =
          !quoted;

      }

    }


    else if(
      c === "," &&
      !quoted
    ){

      row.push(field);

      field = "";

    }


    else if(
      (
        c === "\n" ||
        c === "\r"
      )
      &&
      !quoted
    ){

      if(
        c === "\r" &&
        text[i + 1] === "\n"
      ){

        i++;

      }

      row.push(field);


      if(
        row.some(
          x =>
            x.trim() !== ""
        )
      ){

        rows.push(row);

      }


      row = [];

      field = "";

    }


    else{

      field += c;

    }

  }


  if(
    field.length ||
    row.length
  ){

    row.push(field);


    if(
      row.some(
        x =>
          x.trim() !== ""
      )
    ){

      rows.push(row);

    }

  }


  return rows;

}


/* =========================
   UTILIDADES
========================= */

function clean(value){

  return String(
    value ?? ""
  )
    .replace(
      /\uFEFF/g,
      ""
    )
    .trim();

}


function safe(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function formatPrice(price){

  return clean(price);

}


/* =========================
   OFERTA
========================= */

function isOffer(p){

  const value =
    clean(p.offer)
      .toUpperCase();


  return(
    value === "SI" ||
    value === "SÍ" ||
    value === "YES" ||
    value === "1"
  );

}


/* =========================
   STOCK
========================= */

function getStockInfo(status){

  const value =
    clean(status)
      .toUpperCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      );


  if(
    value.includes("SIN STOCK") ||
    value.includes("AGOTADO")
  ){

    return{
      label:"SIN STOCK",
      className:"stock-out",
      available:false
    };

  }


  if(
    value.includes("ULTIMA UNIDAD") ||
    value.includes("ULTIMO") ||
    value.includes("ULTIMA")
  ){

    return{
      label:"ÚLTIMA UNIDAD",
      className:"stock-last",
      available:true
    };

  }


  if(
    value.includes("A PEDIDO") ||
    value.includes("PEDIDO")
  ){

    return{
      label:"A PEDIDO",
      className:"stock-order",
      available:true
    };

  }


  if(
    value.includes("EN STOCK") ||
    value === "STOCK" ||
    value.includes("DISPONIBLE")
  ){

    return{
      label:"EN STOCK",
      className:"stock-in",
      available:true
    };

  }


  return{
    label:
      clean(status) ||
      "CONSULTAR",

    className:
      "stock-other",

    available:
      true
  };

}


/* =========================
   WHATSAPP COMPRAR
========================= */

function whatsappLink(p){

  const stock =
    getStockInfo(
      p.status
    );


  const message =
`Hola ImportArg! Quiero consultar por:

${p.product} ${p.model}
${p.capacity ? "Capacidad: " + p.capacity : ""}
${p.color ? "Color: " + p.color : ""}
${p.detail ? "Detalle: " + p.detail : ""}
Precio: ${p.price}
Estado: ${stock.label}`;


  return(
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message)
  );

}


/* =========================
   COMPARTIR
========================= */

function shareText(p){

  const stock =
    getStockInfo(
      p.status
    );


  return(
`ImportArg

${p.product} ${p.model}
${p.capacity ? p.capacity + "\n" : ""}${p.color ? p.color + "\n" : ""}${p.detail ? p.detail + "\n" : ""}Precio: ${p.price}
${stock.label}

Ver lista de precios:
${SITE_URL}`
  );

}


async function shareProduct(index){

  const p =
    products[index];


  if(!p){
    return;
  }


  const text =
    shareText(p);


  /*
    CELULARES:
    abre el menú nativo para compartir
    por WhatsApp, Telegram, mensajes,
    mail, etc.
  */

  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          `${p.product} ${p.model}`,

        text:text

      });

      return;

    }

    catch(error){

      if(
        error.name === "AbortError"
      ){

        return;

      }

    }

  }


  /*
    ALTERNATIVA:
    abre WhatsApp SIN número definido,
    para elegir a qué persona enviarlo.
  */

  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(text);


  window.open(
    url,
    "_blank"
  );

}


/* =========================
   CARGAR GOOGLE SHEETS
========================= */

async function loadProducts(){

  try{


    const response =
      await fetch(

        CSV_URL +
        "&t=" +
        Date.now(),

        {
          cache:"no-store"
        }

      );


    if(
      !response.ok
    ){

      throw new Error(
        "No se pudo cargar Google Sheets"
      );

    }


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    const headerIndex =
      rows.findIndex(

        row =>

          clean(
            row[0]
          )
            .toUpperCase()
            === "PRODUCTO"

          &&

          clean(
            row[1]
          )
            .toUpperCase()
            === "MODELO"

      );


    if(
      headerIndex === -1
    ){

      throw new Error(
        "No encontré PRODUCTO / MODELO"
      );

    }


    const headers =
      rows[headerIndex]
        .map(

          value =>
            clean(value)
              .toUpperCase()

        );


    const col =
      name =>
        headers.indexOf(name);


    const cProduct =
      col("PRODUCTO");

    const cModel =
      col("MODELO");

    const cCapacity =
      col("CAPACIDAD");

    const cColor =
      col("COLOR");

    const cDetail =
      col("DETALLE");

    const cPrice =
      col("PRECIO");

    const cStatus =
      col("ESTADO");

    const cOffer =
      col("OFERTA");


    products =
      rows

        .slice(
          headerIndex + 1
        )

        .map(

          (row,index) => ({

            id:index,

            product:
              clean(
                row[cProduct]
              ),

            model:
              clean(
                row[cModel]
              ),

            capacity:
              clean(
                row[cCapacity]
              ),

            color:
              clean(
                row[cColor]
              ),

            detail:
              clean(
                row[cDetail]
              ),

            price:
              clean(
                row[cPrice]
              ),

            status:
              clean(
                row[cStatus]
              ),

            offer:
              cOffer >= 0
                ? clean(
                    row[cOffer]
                  )
                : ""

          })

        )

        .filter(

          p =>
            p.product ||
            p.model ||
            p.price

        );


    document
      .getElementById(
        "loading"
      )
      .style.display =
      "none";


    if(
      window.innerWidth > 700
    ){

      document
        .getElementById(
          "tableWrap"
        )
        .style.display =
        "block";

    }


    buildFilters();

    buildOfferButton();

    render();

  }


  catch(error){

    console.error(error);


    document
      .getElementById(
        "loading"
      )
      .innerHTML =

      `<strong>
        No se pudo cargar la lista.
      </strong>

      <br><br>

      Revisá que Google Sheets
      siga publicado como CSV.`;

  }

}


/* =========================
   CATEGORÍA AUTOMÁTICA
========================= */

function getCategory(p){

  const product =
    clean(
      p.product
    )
      .toUpperCase();


  const model =
    clean(
      p.model
    )
      .toUpperCase();


  const detail =
    clean(
      p.detail
    )
      .toUpperCase();


  const text =
    `${product} ${model} ${detail}`;


/* APPLE */

  if(
    text.includes("IPHONE")
  ){

    return "IPHONE";

  }


  if(
    text.includes("MACBOOK") ||
    text.includes("MAC BOOK")
  ){

    return "MACBOOK";

  }


  if(
    text.includes("IPAD")
  ){

    return "IPAD";

  }


  if(
    text.includes("AIRPOD") ||
    text.includes("AIR POD")
  ){

    return "AIRPODS";

  }


/* ACCESORIOS */

  if(

    text.includes("ACCESORIO")

    ||

    text.includes("MAGSAFE")

    ||

    text.includes("AIRTAG")

    ||

    text.includes("APPLE PENCIL")

    ||

    (
      text.includes("APPLE")
      &&
      (
        text.includes("CARGADOR") ||
        text.includes("ADAPTADOR") ||
        text.includes("CABLE") ||
        text.includes("FUNDA") ||
        text.includes("PENCIL")
      )
    )

  ){

    return "ACCESORIOS";

  }


/* SONY */

  if(
    text.includes("SONY") ||
    text.includes("PLAYSTATION") ||
    text.includes("PLAY STATION") ||
    text.includes("PS5") ||
    text.includes("PS 5")
  ){

    return "SONY";

  }


/* SAMSUNG */

  if(
    text.includes("SAMSUNG") ||
    text.includes("GALAXY")
  ){

    return "SAMSUNG";

  }


/* XIAOMI */

  if(
    text.includes("XIAOMI") ||
    text.includes("POCO") ||
    text.includes("REDMI")
  ){

    return "XIAOMI";

  }


/* RAYBAN META */

  if(
    text.includes("RAYBAN META") ||
    text.includes("RAY-BAN META") ||
    text.includes("RAY BAN META") ||
    text.includes("META RAYBAN") ||
    text.includes("META RAY-BAN") ||
    text.includes("META RAY BAN")
  ){

    return "RAYBAN META";

  }


/*
  CUALQUIER PRODUCTO NUEVO:

  usa automáticamente el contenido
  de la columna PRODUCTO como solapa.

  JBL -> JBL
  GARMIN -> GARMIN
  NINTENDO -> NINTENDO
  MOTOROLA -> MOTOROLA
*/

  return(
    product ||
    "OTROS"
  );

}


/* =========================
   CREAR CATEGORÍAS
========================= */

function buildFilters(){

  const preferred = [

    "IPHONE",
    "MACBOOK",
    "IPAD",
    "AIRPODS",
    "ACCESORIOS"

  ];


  const categories = [

    ...new Set(

      products
        .map(
          getCategory
        )
        .filter(
          Boolean
        )

    )

  ];


  categories.sort(

    (a,b) => {

      const ai =
        preferred.indexOf(a);

      const bi =
        preferred.indexOf(b);


      if(
        ai !== -1 &&
        bi !== -1
      ){

        return ai - bi;

      }


      if(
        ai !== -1
      ){

        return -1;

      }


      if(
        bi !== -1
      ){

        return 1;

      }


      return a.localeCompare(
        b,
        "es"
      );

    }

  );


  if(
    currentFilter !== "TODOS" &&
    currentFilter !== "OFERTAS" &&
    !categories.includes(
      currentFilter
    )
  ){

    currentFilter =
      "TODOS";

  }


  const container =
    document.getElementById(
      "filters"
    );


  container.innerHTML =

    [
      "TODOS",
      ...categories
    ]

    .map(

      category => `

        <button
          class="filter ${
            currentFilter === category
              ? "active"
              : ""
          }"
          data-filter="${safe(category)}"
        >

          ${safe(category)}

        </button>

      `

    )

    .join("");

}


/* =========================
   BOTÓN OFERTAS
========================= */

function buildOfferButton(){

  const hasOffers =
    products.some(
      isOffer
    );


  const area =
    document.getElementById(
      "offerArea"
    );


  const button =
    document.getElementById(
      "offerButton"
    );


  if(
    hasOffers
  ){

    area.style.display =
      "block";

  }

  else{

    area.style.display =
      "none";


    if(
      currentFilter === "OFERTAS"
    ){

      currentFilter =
        "TODOS";

    }

  }


  button.classList.toggle(
    "active",
    currentFilter === "OFERTAS"
  );

}


/* =========================
   FILTRAR PRODUCTOS
========================= */

function filteredProducts(){

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toUpperCase();


  return products.filter(

    p => {


      const text = [

        p.product,
        p.model,
        p.capacity,
        p.color,
        p.detail,
        p.price,
        p.status

      ]

        .join(" ")
        .toUpperCase();


      const searchOK =
        text.includes(
          search
        );


      let filterOK =
        true;


      if(
        currentFilter === "OFERTAS"
      ){

        filterOK =
          isOffer(p);

      }


      else if(
        currentFilter !== "TODOS"
      ){

        filterOK =
          getCategory(p) ===
          currentFilter;

      }


      return(
        searchOK &&
        filterOK
      );

    }

  );

}


/* =========================
   RENDER
========================= */

function render(){

  const list =
    filteredProducts();


  document
    .getElementById(
      "results"
    )
    .textContent =

    list.length +

    (
      list.length === 1
        ? " producto"
        : " productos"
    );


  renderMobile(list);

  renderDesktop(list);

}

   MOBILE
========================= */

</div>

}


/* =========================
   DESKTOP
========================= */

  document
    .getElementById(
      "table"
    )
    .innerHTML =

    list.map(

      p => {


        const stock =
          getStockInfo(
            p.status
          );


        const buyText =
          stock.available
            ? "COMPRAR"
            : "CONSULTAR";


        return `

<tr>


  <td>

    <strong>
      ${safe(p.product)}
    </strong>

  </td>


  <td>
    ${safe(p.model)}
  </td>


  <td>
    ${safe(p.capacity)}
  </td>


  <td>
    ${safe(p.color)}
  </td>


  <td>
    ${safe(p.detail)}
  </td>


  <td class="desktop-price">

    ${safe(
      formatPrice(

      )
    )}

  </td>


  <td>

</tr>

        `;

      }

}


/* =========================
   BUSCADOR
========================= */

const searchInput =
  document.getElementById(
    "search"
  );


searchInput.addEventListener(

  "input",

  render

);


document
  .getElementById(
    "searchButton"
  )
  .addEventListener(

    "click",

    () => {

      render();

      searchInput.focus();

    }

  );


searchInput.addEventListener(

  "keydown",

  event => {

    if(
      event.key === "Enter"
    ){

      render();

      searchInput.blur();

    }

  }

);


/* =========================
   CATEGORÍAS
========================= */

document
  .getElementById(
    "filters"
  )
  .addEventListener(

    "click",

    event => {


      const button =
        event.target.closest(
          ".filter"
        );


      if(
        !button
      ){

        return;

      }


      currentFilter =
        button.dataset.filter;


      document
        .querySelectorAll(
          ".filter"
        )
        .forEach(

          b =>
            b.classList.remove(
              "active"
            )

        );


      button
        .classList
        .add(
          "active"
        );


      document
        .getElementById(
          "offerButton"
        )
        .classList
        .remove(
          "active"
        );


      render();

    }

  );


/* =========================
   OFERTAS
========================= */

document
  .getElementById(
    "offerButton"
  )
  .addEventListener(

    "click",

    () => {


      currentFilter =
        "OFERTAS";


      document
        .querySelectorAll(
          ".filter"
        )
        .forEach(

          b =>
            b.classList.remove(
              "active"
            )

        );


      document
        .getElementById(
          "offerButton"
        )
        .classList
        .add(
          "active"
        );


      render();

    }

  );


/* =========================
   INICIAR
========================= */

loadProducts();


/*
  Actualiza Google Sheets
  cada 5 minutos.

  También detecta:
  - productos nuevos
  - categorías nuevas
  - ofertas nuevas
  - cambios de precio
  - cambios de stock
*/

setInterval(

  loadProducts,

  300000

);


</script>
