<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ImportArg | Lista Mayorista</title>

<style>
:root{
  --black:#111;
  --black2:#1c1c1c;
  --yellow:#ffd51f;
  --green:#9ee8b3;
  --bg:#f4f4f4;
  --gray:#777;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#151515;
}


/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(135deg,#090909,#242424);
  border-bottom:4px solid var(--yellow);

  /* importante para iPhone */
  padding-top:calc(env(safe-area-inset-top) + 10px);
}

.header{
  max-width:1400px;
  margin:auto;
  padding:8px 16px 13px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.logo{
  color:white;
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--yellow);
}

.logo small{
  display:block;
  font-size:7px;
  letter-spacing:4px;
  font-weight:600;
  text-align:center;
}

.title{
  color:white;
  text-align:center;
  flex:1;
}

.title strong{
  font-size:22px;
}

.title strong span{
  color:var(--yellow);
}

.daily{
  border:1px solid #555;
  background:#151515;
  border-radius:9px;
  padding:7px 11px;
  color:white;
  text-align:center;
  font-size:9px;
  font-weight:800;
}

.daily span{
  display:block;
  color:var(--yellow);
  font-size:10px;
  margin-top:2px;
}


/* =========================
   MAIN
========================= */

main{
  max-width:1400px;
  margin:auto;
  padding:13px;
}


/* =========================
   BUSCADOR
========================= */

.search{
  position:relative;
  margin-bottom:10px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:16px;
  pointer-events:none;
}

#search{
  width:100%;
  height:45px;
  border:1px solid #ddd;
  background:white;
  border-radius:12px;
  outline:none;
  padding:0 14px 0 42px;
  font-size:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

#search:focus{
  border:2px solid var(--yellow);
}


/* =========================
   FILTROS
========================= */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 0 9px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:0;
  background:white;
  border-radius:30px;
  padding:9px 15px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.filter.active{
  background:var(--yellow);
}


/* =========================
   RESULTADOS
========================= */

.results{
  color:#777;
  font-size:11px;
  margin:0 2px 8px;
}


/* =========================
   DESKTOP TABLE
========================= */

.table-wrap{
  background:white;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.09);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#111;
  color:white;
}

th{
  padding:12px 8px;
  font-size:12px;
}

th.price-head{
  background:var(--yellow);
  color:#111;
}

td{
  text-align:center;
  padding:8px;
  font-size:12px;
  border-bottom:1px solid #ddd;
}

tbody tr:nth-child(even){
  background:#f4f4f4;
}

.desktop-price{
  background:#fff3b8;
  font-weight:900;
  font-size:14px;
}


/* =========================
   STOCK
========================= */

.stock{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 11px;
  min-width:70px;
  border-radius:30px;
  background:var(--green);
  color:#075b24;
  font-size:10px;
  font-weight:900;
}

.no-stock{
  background:#ffd0d0;
  color:#8c0000;
}


/* =========================
   MOBILE CARDS
========================= */

.cards{
  display:none;
}

.card{
  background:white;
  border-radius:13px;
  margin-bottom:8px;
  overflow:hidden;
  border:1px solid #e3e3e3;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.card-main{
  padding:11px 12px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}

.card-product{
  color:#9b7d00;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.card-model{
  font-size:17px;
  font-weight:900;
  margin-top:1px;
}

.card-info{
  padding:0 12px 10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.info-item{
  min-width:0;
}

.info-item small{
  display:block;
  color:#999;
  font-size:8px;
  font-weight:800;
  margin-bottom:2px;
}

.info-item strong{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-footer{
  border-top:1px solid #eee;
  padding:9px 12px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.price small{
  display:block;
  color:#888;
  font-size:8px;
  font-weight:700;
}

.price strong{
  display:block;
  font-size:20px;
  font-weight:950;
  letter-spacing:-.5px;
}

.consult{
  border:0;
  background:#111;
  color:white;
  border-radius:8px;
  padding:8px 11px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
}

.consult span{
  color:var(--yellow);
}


/* =========================
   WHATSAPP FLOAT
========================= */

.whatsapp{
  position:fixed;
  right:14px;
  bottom:calc(14px + env(safe-area-inset-bottom));

  width:51px;
  height:51px;
  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#25D366;
  color:white;

  text-decoration:none;
  font-size:25px;

  box-shadow:0 5px 20px rgba(0,0,0,.25);
  z-index:100;
}


/* =========================
   LOADING
========================= */

.loading{
  background:white;
  border-radius:13px;
  padding:35px 15px;
  text-align:center;
}

.spinner{
  width:30px;
  height:30px;
  margin:0 auto 10px;

  border:4px solid #ddd;
  border-top-color:var(--yellow);
  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{
    padding-top:calc(env(safe-area-inset-top) + 4px);
  }

  .header{
    padding:5px 12px 9px;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:4px 10px;
  }

  .logo{
    font-size:21px;
  }

  .logo small{
    font-size:6px;
    letter-spacing:3px;
  }

  .title{
    text-align:right;
  }

  .title strong{
    font-size:18px;
  }

  .daily{
    grid-column:1 / -1;
    padding:5px 8px;
    display:flex;
    justify-content:center;
    gap:5px;
    align-items:center;
    font-size:9px;
  }

  .daily span{
    display:inline;
    margin:0;
    font-size:9px;
  }

  main{
    padding:9px 9px 80px;
  }

  #search{
    height:42px;
    border-radius:10px;
  }

  .filter{
    padding:8px 13px;
    font-size:10px;
  }

  .table-wrap{
    display:none;
  }

  .cards{
    display:block;
  }

}


/* very small phones */

@media(max-width:370px){

  .title strong{
    font-size:16px;
  }

  .logo{
    font-size:19px;
  }

  .price strong{
    font-size:18px;
  }

}
</style>
</head>


<body>


<header>

  <div class="header">

    <div class="logo">
      import<span>Arg</span>
      <small>PRECIOS</small>
    </div>

    <div class="title">
      <strong>LISTA <span>MAYORISTA</span></strong>
    </div>

    <div class="daily">
      LISTA DIARIA
      <span>APPLE / SAMSUNG / XIAOMI</span>
    </div>

  </div>

</header>


<main>

  <div class="search">

    <span class="search-icon">⌕</span>

    <input
      id="search"
      type="search"
      placeholder="Buscar modelo, capacidad, color..."
      autocomplete="off"
    >

  </div>


  <div class="filters">

    <button class="filter active" data-filter="TODOS">
      TODOS
    </button>

    <button class="filter" data-filter="IPHONE">
      APPLE
    </button>

    <button class="filter" data-filter="SAMSUNG">
      SAMSUNG
    </button>

    <button class="filter" data-filter="XIAOMI">
      XIAOMI
    </button>

  </div>


  <div class="results" id="results">
    Cargando productos...
  </div>


  <div class="loading" id="loading">

    <div class="spinner"></div>

    Actualizando lista...

  </div>


  <!-- PC -->

  <div class="table-wrap" id="tableWrap" style="display:none">

    <table>

      <thead>

        <tr>

          <th>PRODUCTO</th>
          <th>MODELO</th>
          <th>CAPACIDAD</th>
          <th>COLOR</th>
          <th>DETALLE</th>

          <th class="price-head">
            PRECIO
          </th>

          <th>ESTADO</th>

        </tr>

      </thead>

      <tbody id="table"></tbody>

    </table>

  </div>


  <!-- MOBILE -->

  <div class="cards" id="cards"></div>

</main>


<a
  class="whatsapp"
  href="https://wa.me/5491124014722"
  target="_blank"
  aria-label="WhatsApp"
>
  ☎
</a>


<script>

/* =====================================
   CONFIGURACIÓN
===================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vT8v35uv1oCfpyY7_R0fSKYG08h43uApPtUIy-VBItP2Njs99BeXR5VkKeWtZ5L2w/pub?output=csv";

const WHATSAPP =
"5491124014722";

let products = [];
let currentFilter = "TODOS";


/* =====================================
   CSV PARSER
===================================== */

function parseCSV(text){

  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;


  for(let i=0;i<text.length;i++){

    const c = text[i];


    if(c === '"'){

      if(quoted && text[i+1] === '"'){

        field += '"';
        i++;

      }else{

        quoted = !quoted;

      }

    }

    else if(c === "," && !quoted){

      row.push(field);
      field = "";

    }

    else if(
      (c === "\n" || c === "\r") &&
      !quoted
    ){

      if(c === "\r" && text[i+1] === "\n"){
        i++;
      }

      row.push(field);

      if(row.some(x => x.trim() !== "")){
        rows.push(row);
      }

      row = [];
      field = "";

    }

    else{

      field += c;

    }

  }


  if(field.length || row.length){

    row.push(field);

    if(row.some(x => x.trim() !== "")){
      rows.push(row);
    }

  }


  return rows;

}


/* =====================================
   UTILIDADES
===================================== */

function clean(v){

  return String(v ?? "")
    .replace(/\uFEFF/g,"")
    .trim();

}


function safe(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function available(status){

  const s = status.toUpperCase();

  return (
    s.includes("STOCK") &&
    !s.includes("SIN")
  );

}


/* =====================================
   WHATSAPP PRODUCTO
===================================== */

function whatsappLink(p){

  const message =
`Hola ImportArg! Quiero consultar por:

${p.product} ${p.model}
${p.capacity}
Color: ${p.color}
Precio: ${p.price}`;

  return "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(message);

}


/* =====================================
   LOAD GOOGLE SHEETS
===================================== */

async function loadProducts(){

  try{

    const response =
      await fetch(
        CSV_URL + "&t=" + Date.now(),
        {cache:"no-store"}
      );


    if(!response.ok){
      throw new Error("Error Google Sheets");
    }


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    const headerIndex =
      rows.findIndex(row =>
        clean(row[0]).toUpperCase() === "PRODUCTO" &&
        clean(row[1]).toUpperCase() === "MODELO"
      );


    if(headerIndex === -1){

      throw new Error(
        "No se encontró PRODUCTO / MODELO"
      );

    }


    const headers =
      rows[headerIndex]
      .map(x =>
        clean(x).toUpperCase()
      );


    const col =
      name => headers.indexOf(name);


    const cProduct =
      col("PRODUCTO");

    const cModel =
      col("MODELO");

    const cCapacity =
      col("CAPACIDAD");

    const cColor =
      col("COLOR");

    const cDetail =
      col("DETALLE");

    const cPrice =
      col("PRECIO");

    const cStatus =
      col("ESTADO");


    products =
      rows
      .slice(headerIndex + 1)
      .map(row => ({

        product:
          clean(row[cProduct]),

        model:
          clean(row[cModel]),

        capacity:
          clean(row[cCapacity]),

        color:
          clean(row[cColor]),

        detail:
          clean(row[cDetail]),

        price:
          clean(row[cPrice]),

        status:
          clean(row[cStatus])

      }))
      .filter(p =>
        p.product ||
        p.model ||
        p.price
      );


    document
      .getElementById("loading")
      .style.display = "none";


    if(window.innerWidth > 700){

      document
        .getElementById("tableWrap")
        .style.display = "block";

    }


    render();

  }

  catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "<strong>No se pudo cargar la lista.</strong><br><br>Revisá Google Sheets.";

  }

}


/* =====================================
   FILTER
===================================== */

function filteredProducts(){

  const search =
    document
    .getElementById("search")
    .value
    .trim()
    .toUpperCase();


  return products.filter(p => {


    const text = [

      p.product,
      p.model,
      p.capacity,
      p.color,
      p.detail,
      p.price,
      p.status

    ]
    .join(" ")
    .toUpperCase();


    const searchOK =
      text.includes(search);


    const product =
      p.product.toUpperCase();


    let filterOK = true;


    if(currentFilter === "IPHONE"){

      filterOK =
        product.includes("IPHONE") ||
        product.includes("APPLE");

    }


    else if(currentFilter === "SAMSUNG"){

      filterOK =
        product.includes("SAMSUNG");

    }


    else if(currentFilter === "XIAOMI"){

      filterOK =
        product.includes("XIAOMI") ||
        product.includes("POCO") ||
        product.includes("REDMI");

    }


    return searchOK && filterOK;

  });

}


/* =====================================
   RENDER
===================================== */

function render(){

  const list =
    filteredProducts();


  document.getElementById("results").textContent =
    list.length +
    (list.length === 1
      ? " producto"
      : " productos");


  renderCards(list);

  renderTable(list);

}


/* =====================================
   MOBILE CARDS
===================================== */

function renderCards(list){

  document.getElementById("cards").innerHTML =

    list.map(p => {

      const inStock =
        available(p.status);


      return `

      <article class="card">

        <div class="card-main">

          <div>

            <div class="card-product">
              ${safe(p.product)}
            </div>

            <div class="card-model">
              ${safe(p.model)}
            </div>

          </div>


          <span class="stock ${inStock ? "" : "no-stock"}">

            ${safe(p.status || "CONSULTAR")}

          </span>

        </div>


        <div class="card-info">

          <div class="info-item">

            <small>CAPACIDAD</small>

            <strong>
              ${safe(p.capacity || "-")}
            </strong>

          </div>


          <div class="info-item">

            <small>COLOR</small>

            <strong>
              ${safe(p.color || "-")}
            </strong>

          </div>


          ${
            p.detail
            ?
            `

            <div class="info-item">

              <small>DETALLE</small>

              <strong>
                ${safe(p.detail)}
              </strong>

            </div>

            `
            :
            ""
          }

        </div>


        <div class="card-footer">

          <div class="price">

            <small>PRECIO MAYORISTA</small>

            <strong>
              ${safe(p.price)}
            </strong>

          </div>


          <a
            class="consult"
            href="${whatsappLink(p)}"
            target="_blank"
          >

            CONSULTAR <span>›</span>

          </a>

        </div>

      </article>

      `;

    }).join("");

}


/* =====================================
   DESKTOP TABLE
===================================== */

function renderTable(list){

  document.getElementById("table").innerHTML =

    list.map(p => {

      const inStock =
        available(p.status);


      return `

      <tr>

        <td>
          <strong>${safe(p.product)}</strong>
        </td>

        <td>
          ${safe(p.model)}
        </td>

        <td>
          ${safe(p.capacity)}
        </td>

        <td>
          ${safe(p.color)}
        </td>

        <td>
          ${safe(p.detail)}
        </td>

        <td class="desktop-price">
          ${safe(p.price)}
        </td>

        <td>

          <span class="stock ${inStock ? "" : "no-stock"}">

            ${safe(p.status || "CONSULTAR")}

          </span>

        </td>

      </tr>

      `;

    }).join("");

}


/* =====================================
   SEARCH
===================================== */

document
.getElementById("search")
.addEventListener(
  "input",
  render
);


/* =====================================
   FILTER BUTTONS
===================================== */

document
.querySelectorAll(".filter")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".filter")
      .forEach(b =>
        b.classList.remove("active")
      );


      button
      .classList
      .add("active");


      currentFilter =
        button.dataset.filter;


      render();

    }
  );

});


/* =====================================
   START
===================================== */

loadProducts();


/* refresca Google Sheets cada 5 min */

setInterval(
  loadProducts,
  300000
);

</script>

</body>
</html>
